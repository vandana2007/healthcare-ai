{% extends "base.html" %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">

        <!-- Profile Info Card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4 text-center">
                {% if profile.profile_picture %}
                    <img src="{{ profile.profile_picture.url }}" alt="Profile Picture"
                         class="rounded-circle mb-3" style="width:120px; height:120px; object-fit:cover; border:3px solid var(--theme-primary);">
                {% else %}
                    <i class="bi bi-person-circle text-theme" style="font-size:120px;"></i>
                {% endif %}

                <h3 class="text-theme mt-2">{{ request.user.username }}</h3>

                <form method="post" enctype="multipart/form-data" class="text-start mt-4">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Profile Picture</label>
                        <input type="file" name="profile_picture" class="form-control" accept="image/*">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ request.user.email }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone_number" class="form-control" value="{{ profile.phone_number }}">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Save Changes
                    </button>
                </form>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h5 class="text-theme mb-3"><i class="bi bi-shield-lock"></i> Change Password</h5>

                <form method="post" action="{% url 'change_password_view' %}">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <input type="password" name="current_password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_new_password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-outline-primary w-100">
                        <i class="bi bi-key"></i> Change Password
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
{% endblock %}
