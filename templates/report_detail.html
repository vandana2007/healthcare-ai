{% extends "base.html" %}
{% block title %}Report Details{% endblock %}

{% block content %}
<a href="{% url 'report_list_view' %}" class="text-decoration-none text-muted mb-3 d-inline-block">
    <i class="bi bi-arrow-left"></i> Back to Reports
</a>

<div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
    <div>
        <h3 class="text-theme mb-1"><i class="bi bi-file-earmark-medical"></i> {{ report.original_filename }}</h3>
        <p class="text-muted mb-0"><i class="bi bi-calendar3"></i> {{ report.uploaded_at|date:"M d, Y H:i" }}</p>
    </div>
    <span class="badge
        {% if report.status == 'completed' %}bg-success
        {% elif report.status == 'processing' %}bg-warning text-dark
        {% else %}bg-danger{% endif %} rounded-pill fs-6">
        {{ report.get_status_display }}
    </span>
</div>

<div class="card shadow-sm border-0 mb-4">
    <div class="card-header card-header-custom">
        <i class="bi bi-robot"></i> AI Explanation
    </div>
    <div class="card-body">
        <div id="ai-explanation-rendered"></div>
    </div>
</div>

<!-- Hidden raw markdown source, rendered by JS below -->
<script id="raw-explanation" type="text/plain">{{ report.ai_explanation }}</script>

<div class="card shadow-sm border-0">
    <div class="card-header bg-light">
        <button class="btn btn-link text-decoration-none p-0 w-100 text-start" type="button" data-bs-toggle="collapse" data-bs-target="#rawTextCollapse">
            <i class="bi bi-code-square"></i> Extracted Text (raw) <i class="bi bi-chevron-down float-end"></i>
        </button>
    </div>
    <div class="collapse" id="rawTextCollapse">
        <div class="card-body" style="
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 350px;
            overflow-y: auto;
            background: #f8f9fa;
        ">{{ report.extracted_text }}</div>
    </div>
</div>

<!-- Lightweight markdown renderer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
    const rawMarkdown = document.getElementById("raw-explanation").textContent;
    document.getElementById("ai-explanation-rendered").innerHTML = marked.parse(rawMarkdown);
</script>
{% endblock %}
